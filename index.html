  <title>ChatGPT</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; color: #f5f5f5; }
    body { min-height: 100dvh; }
    .app { height: 100dvh; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 18px max(12px, env(safe-area-inset-bottom)); }
    header { height: 56px; display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #303030; border-radius: 50%; color: #f3f3f3; background: #191919; }
    .icon-button svg { width: 23px; height: 23px; }
    .brand { color: #aaa; font-size: 15px; letter-spacing: .01em; }
    main { flex: 1; overflow-y: auto; padding: 28px 2px 18px; display: flex; flex-direction: column; gap: 22px; scrollbar-width: thin; }
    .intro { align-self: flex-start; max-width: 88%; line-height: 1.5; font-size: 17px; color: #eee; }
    .intro-label { display: block; color: #929292; font-size: 13px; margin-bottom: 7px; }
    .message { align-self: flex-end; max-width: 88%; padding: 12px 16px; border-radius: 22px; background: #272727; color: #f5f5f5; line-height: 1.45; font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .composer-wrap { flex: 0 0 auto; }
    .composer { min-height: 58px; border: 1px solid #373737; background: #202020; border-radius: 30px; padding: 7px 8px 7px 18px; display: flex; align-items: flex-end; gap: 10px; box-shadow: 0 2px 16px #0008; }
    textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 16px; line-height: 1.4; padding: 10px 0; min-height: 42px; max-height: 140px; }
    textarea::placeholder { color: #858585; }
    .send { border: 0; border-radius: 50%; width: 42px; height: 42px; flex: 0 0 42px; background: #f2f2f2; color: #111; display: grid; place-items: center; cursor: pointer; }
    .send:disabled { background: #484848; color: #888; cursor: default; }
    .send svg { width: 20px; height: 20px; }
    .hint { color: #777; text-align: center; font-size: 11px; padding-top: 9px; }
    @media (min-width: 600px) { .app { padding-left: 28px; padding-right: 28px; } main { padding-top: 44px; } .intro, .message { max-width: 75%; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <button class="icon-button" id="reset" aria-label="Start a fresh thought" title="Start fresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg>
      </button>
      <div class="brand">Memory off</div>
      <span style="width:44px" aria-hidden="true"></span>
    </header>
    <main id="conversation" aria-live="polite" aria-label="Conversation">
      <div class="intro"><span class="intro-label">For you:</span>You can think. So think. 
      You can read. So read. 
      Don't outsource your own cognition.</div>
    </main>
    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="input" rows="1" aria-label="Write your thought" placeholder="Ask ChatGPT" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </form>
      <div class="hint">You have a neural network yourself</div>
    </div>
  </div>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const conversation = document.querySelector('#conversation');

    function resize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      send.disabled = !input.value.trim();
    }
    input.addEventListener('input', resize);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const message = document.createElement('div');
      message.className = 'message';
      message.textContent = text;
      conversation.append(message);
      input.value = '';
      resize();
      conversation.scrollTop = conversation.scrollHeight;
      input.focus();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      conversation.querySelectorAll('.message').forEach(message => message.remove());
      input.value = '';
      resize();
      input.focus();
    });
  </script>
</body>
</html>
